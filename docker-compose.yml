services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: subject
      POSTGRES_PASSWORD: subject
      POSTGRES_DB: subject
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U subject"]
      interval: 2s
      retries: 15

volumes:
  pgdata:
