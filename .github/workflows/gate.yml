name: gate

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', '.gitignore']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', '.gitignore']

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            frontend/pnpm-lock.yaml
            crawler/pnpm-lock.yaml
            reporting/pnpm-lock.yaml
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: pnpm --dir crawler install --frozen-lockfile
      - run: pnpm --dir reporting install --frozen-lockfile
      - run: pnpm --dir frontend exec playwright install --with-deps chromium
      - run: make gate
